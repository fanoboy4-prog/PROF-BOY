html+="<div><b>"+t.piano+"</b><div class=\"piano\"><div class=\"key\" id=\"k1\">C</div><div class=\"key black\" id=\"k2\">C#</div><div class=\"key\" id=\"k3\">D</div><div class=\"key black\" id=\"k4\">D#</div><div class=\"key\" id=\"k5\">E</div><div class=\"key\" id=\"k6\">F</div><div class=\"key black\" id=\"k7\">F#</div><div class=\"key\" id=\"k8\">G</div><div class=\"key black\" id=\"k9\">G#</div><div class=\"key\" id=\"k10\">A</div><div class=\"key black\" id=\"k11\">A#</div><div class=\"key\" id=\"k12\">B</div></div><p>"+t.happy+" | "+t.sad+"</p></div>";
html+="<div><b>"+t.beat+"</b><div class=\"grid\" id=\"beatGrid\"></div></div>";
html+="<input id=\"searchBox\" placeholder=\""+t.search+"\" value=\""+query+"\">";
html+="<div id=\"listBox\"></div>";
html+="<div class=\"challenge\"><b>"+t.challenge+"</b></div>";
document.getElementById("app").innerHTML=html;
document.getElementById("lg-mg").onclick=function(){lang="mg";localStorage.setItem("boy_lang",lang);render();};
document.getElementById("lg-fr").onclick=function(){lang="fr";localStorage.setItem("boy_lang",lang);render();};
document.getElementById("lg-en").onclick=function(){lang="en";localStorage.setItem("boy_lang",lang);render();};
document.getElementById("btnEdit").onclick=function(){profile=null;renderWelcome();};
var notes=[261,277,293,311,329,349,369,392,415,440,466,493];
for(var i=1;i<=12;i++){ (function(idx){ document.getElementById("k"+idx).onclick=function(){playNote(notes[idx-1]);}; })(i); }
var grid=document.getElementById("beatGrid");
var rows=["KICK","CLAP","HI-HAT"];
rows.forEach(function(r){
var s=document.createElement("span"); s.innerText=r; grid.appendChild(s);
for(var j=0;j<16;j++){ var d=document.createElement("div"); d.className="cell"; if((r==="KICK"&&[0,4,8,12].indexOf(j)>=0)||(r==="CLAP"&&[4,12].indexOf(j)>=0)||(r==="HI-HAT"&&j%2===0)){d.className="cell on";} d.onclick=function(){toggleCell(this);}; grid.appendChild(d); }
});
document.getElementById("searchBox").oninput=function(){query=this.value;renderList();};
function renderList(){
var lb=document.getElementById("listBox"); if(!lb) return;
var list=lessons.filter(function(l){return l.title[lang].toLowerCase().indexOf(query.toLowerCase())>=0||l.steps[lang].join(" ").toLowerCase().indexOf(query.toLowerCase())>=0;});
var lh="";
list.forEach(function(l){ lh+="<div class=\"card\" data-id=\""+l.id+"\"><span class=\"badge\">"+l.cat+"</span><h3>"+l.title[lang]+"</h3><p>"+l.steps[lang][0]+"</p></div>"; });
lb.innerHTML=lh;
var cards=lb.querySelectorAll(".card");
cards.forEach(function(c){ c.onclick=function(){ current=parseInt(c.getAttribute("data-id")); render(); }; });
}
renderList();
}else{
var l=lessons.find(function(x){return x.id===current});
html+="<button class=\"back\" id=\"btnBack\">"+t.back+"</button><h2>"+l.title[lang]+"</h2>";
if(l.id===1){html+=flDiagram()+legend();}
if(l.id===3){html+="<div class=\"mini\"><b>"+t.pianoR+" - SOURIS</b><br>Clic gauche = mametraka - Clic droit = mamafa</div>";}
l.steps[lang].forEach(function(s,i){html+="<div class=\"step\"><b>Etape "+(i+1)+":</b> "+s+"</div>";});
html+="<button style=\"background:#ff6a00;color:#fff;width:100%;margin-top:12px\" id=\"btnNext\">"+t.understood+"</button>";
document.getElementById("app").innerHTML=html;
document.getElementById("lg-mg").onclick=function(){lang="mg";localStorage.setItem("boy_lang",lang);render();};
document.getElementById("lg-fr").onclick=function(){lang="fr";localStorage.setItem("boy_lang",lang);render();};
document.getElementById("lg-en").onclick=function(){lang="en";localStorage.setItem("boy_lang",lang);render();};
document.getElementById("btnEdit").onclick=function(){profile=null;renderWelcome();};
document.getElementById("btnBack").onclick=function(){current=null;render();};
document.getElementById("btnNext").onclick=function(){current=null;render();};
}
}
render();
</script>
